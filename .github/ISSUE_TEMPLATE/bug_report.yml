name: Bug report
description: A tool answers wrongly, or the server will not talk to your engine
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead, and why is the actual result wrong?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >-
        The environment variables you set, **with the secrets removed** — the names and shapes are
        what matter (`CAMUNDA_BASE_URL=https://host/engine-rest`, `CAMUNDA_AUTH_TRANSPORT=cookie`,
        …). The server's startup banner on stderr is a good summary and contains no secrets.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: What was called, and what came back
      description: The tool name and arguments, plus the error or result (secrets removed).
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version of @deitum/camunda-mcp
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: camunda
    attributes:
      label: Camunda version and deployment
      description: Engine version, and how it is published (standalone, Spring Boot, behind a proxy).
      placeholder: 7.20.0, camunda-bpm-platform:run behind nginx
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node.js version and MCP client
      placeholder: Node.js 22.11.0, Claude Desktop
    validations:
      required: true
